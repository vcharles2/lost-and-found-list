<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lost and found for Students</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Lost and Found</h1>

        <!-- Form for submitting lost or found items -->
        <form id="lostItemForm">
            <select id="categoryInput" aria-label="Item Status">
                <option value="Lost">Lost</option>
                <option value="Found">Found</option>
            </select>

            <input type="text" id="itemInput" placeholder="Enter item name (i.e., textbook, wallet)" required autocomplete="off">
            
            <textarea id="descriptionInput" rows="2" placeholder="Enter description (color, course name, distinguishing details)"></textarea>
            
            <div id="errorMessage" class="error-message"></div>
            <button type="submit" class="add-btn">Submit</button>
        </form>

        <!-- List to display items -->
        <ul id="lostItemsList"></ul>
        <div id="emptyMessage" class="empty-state">No lost items reported yet.</div>

        <!-- Linking JavaScript -->
        <script src="itemService.js"></script>
        <script src="script.js"></script>
    </body>
</html>
